<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description"><title id="title">Fixed SM/Higgs structural classification</title><desc id="description">Derivative-free absolute baryon-number change one, fixed three-generation neutral-Higgs scalar cyclic q/l input. 572 labeled inputs: 326 allowed, 246 forbidden at all degrees. Exact minimum engineering dimensions and counts: 7: 48; 9: 98; 10: 62; 14: 28; 15: 16; 19: 16; 20: 10; 24: 28; 27: 10; 31: 10. Forbidden inputs have no finite minimum. Data: Physics.SMB1ExactMinima.minimum_distribution and classified_count; Physics.SMFiniteLeptonAssignments.rows_length. Dimensions are half the Lean grades.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d2d40}.domain,.tick line{stroke:#9aa8b8}.tick text{fill:#45566b}.grid line{stroke:#e6ebf1}.grid .domain{display:none}</style><rect width="1000" height="460" rx="10" fill="#fff" stroke="#d9e0e8"></rect><text x="30" y="38" font-size="25" font-weight="600">Fixed SM/Higgs structural classification</text><text x="30" y="65" font-size="15">Derivative-free |ΔB| = 1 · three generations · neutral Higgs · scalar cyclic q/l actions</text><text x="30" y="111" font-size="18" font-weight="600">572 labeled inputs</text><text x="405" y="111" font-size="18" font-weight="600">Exact minima of the 326 allowed inputs</text><text x="30" y="153" font-size="15">Allowed</text><rect x="30" y="165" width="165.27972027972027" height="28" fill="#2466a3"></rect><text x="205.27972027972027" y="185" font-size="16" font-weight="600">326</text><text x="30" y="238" font-size="15">Forbidden at all degrees</text><rect x="30" y="250" width="124.72027972027972" height="28" fill="#73808e"></rect><text x="164.72027972027973" y="270" font-size="16" font-weight="600">246</text><text x="30" y="340" font-size="14">Forbidden inputs have</text><text x="30" y="361" font-size="14">no finite minimum dimension.</text><g class="grid" transfor